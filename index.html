<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Balanceo Químico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Simulador de Balanceo Químico</h1>
  <input id="equation-input" placeholder="H2 + O2 -> H2O" size="40">
  <button id="balance-btn">Balancear</button>
  <button id="simulate-btn">Simular</button>
  <div id="reaction-type"></div>
  <div id="equation-display" class="equation"></div>
  <div id="atom-counts"></div>
  <div id="verification"></div>
  <h3>Pasos:</h3>
  <div id="steps"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
